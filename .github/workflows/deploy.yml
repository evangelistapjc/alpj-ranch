name: Deploy ALPJ Ranch to GitHub Pages

# Compiles SCSS → resources/css/stylesheet.css, then publishes the site to Pages.
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.

on:
  push:
    branches: [main]        # change to "master" if that's your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile SCSS
        run: |
          npm install -g sass
          sass resources/scss/main.scss resources/css/stylesheet.css --style=compressed --no-source-map

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
