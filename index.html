<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ALPJ Ranch — Plant Care</title>
    <meta name="theme-color" content="#6f4526" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPJ Ranch" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="resources/stylesheet.css">
    <script type="module" src="resources/main.js" defer></script>
  </head>
  <body>
    <div class="wrap" id="app">
      <div class="loading pixel">🌱 Loading ALPJ Ranch…</div>
    </div>
    <div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()">
      <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="mName">
        <div class="m-top"><span class="m-sprite" id="mSprite">🌱</span>
          <div><h3 id="mName" class="pixel">Plant</h3><div class="m-bot" id="mBot"></div></div>
          <button class="m-close" onclick="closeModal()">✕</button></div>
        <div class="m-tabs" id="mTabs"></div>
        <div class="m-body" id="mBody"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </body>
</html>
